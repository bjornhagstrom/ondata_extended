# The CKAN ecosystem proof of concept (docs/ckan-ecosystem-profile.md): a test Worker on workers.dev (2026-11-14).
# Deploy: npm run deploy:ecosystem (Björn's ok each time); check: SMOKE_URL=https://<worker>/mcp node scripts/smoke-ecosystem.mjs
name = "ondata-extended-ckan-ecosystem"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = false

[observability]
enabled = true

[vars]
ECOSYSTEM_ALLOWED_DOMAINS = "raw.githubusercontent.com"
