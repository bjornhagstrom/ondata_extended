# One Worker for several services, each at its own path (docs/DECISIONS.md, 2026-11-15):
#   /ecosystem/mcp            the CKAN ecosystem proof of concept, public (listed on / and /health)
#   /<secret>/mcp             the vocabulary service, private: the path is the secret SERVICES_VOCAB_PATH
#   /tematres/mcp             the TemaTres demo (vocabularies on vocabularyserver.com, a lunfardo lexicon on
#                             terminologias.filo.uba.ar and the project's test instance on vocab.hagstrom.nu),
#                             public since the issue to its maintainer (listed on / and /health)
# Set the secret (48 random characters; a Worker secret cannot be read back, so keep the value, e.g. in a password
# manager, before it goes to Cloudflare):
#   P=$(openssl rand -base64 36 | tr '+/' '-_' | tr -d '=\n'); echo "$P"
#   printf %s "$P" | npx wrangler secret put SERVICES_VOCAB_PATH -c packages/host-services/wrangler.toml
# The private URL is then https://<worker>/$P/mcp. To rotate: the same with a new value, then update the connectors.
# The write test, private and behind a login (/<SERVICES_SKRIVPROV_PATH>/mcp). Four secrets:
#   SERVICES_SKRIVPROV_PATH        its path, made as SERVICES_VOCAB_PATH above (printed once, to keep for the connector)
#   SKRIVPROV_LOGIN_PASSWORD       the password typed on the login page (16-1024 characters; keep it, e.g. in the Keychain)
#   SKRIVPROV_LOGIN_SIGNING_SECRET 32-256 characters of A-Z, a-z, 0-9, "_", "-", never printed and never needed again:
#     openssl rand -base64 36 | tr '+/' '-_' | tr -d '=\n' | npx wrangler secret put SKRIVPROV_LOGIN_SIGNING_SECRET -c packages/host-services/wrangler.toml
#   SKRIVPROV_WRITE_KEY            the write API's key (64 hex), from the Keychain entry tematres-skrivprov-mcp:
#     security find-generic-password -s tematres-skrivprov-mcp -w | tr -d '\n' | npx wrangler secret put SKRIVPROV_WRITE_KEY -c packages/host-services/wrangler.toml
# Without the path, the password or the signing secret the service is off (404); without the key it reads, and the
# change tools answer that changes are not offered. Changing the password or the signing secret ends every login.
# Deploy: npm run deploy:services (Björn's ok each time). Deployed 2026-11-15.
name = "ondata-extended-services"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = false

# No stored logs or traces: Cloudflare attaches the request URL, and so the private service's secret path, to what it
# stores for a request (docs/DECISIONS.md, 2026-11-15). Our log line per tool call can still be watched live with
# `wrangler tail`, which shows the URL too.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

# The write test's login: at most five password attempts a minute per client address (src/services.ts, SKRIVPROV_LOGIN).
# A Workers rate limiting binding; its counts are per Cloudflare location and approximate, which is enough against
# guessing a password of 32 random characters. namespace_id is any number unique within the account.
[[ratelimits]]
name = "SKRIVPROV_LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
# Each service has its own namespace and its own engine: allowed hosts, cache and rate limit are not shared.
VOCAB_ALLOWED_DOMAINS = "begrepp.hagstrom.nu"
ECOSYSTEM_ALLOWED_DOMAINS = "raw.githubusercontent.com"
# Three hosts; the rate limit below counts per hostname: at most 5 requests a second from one isolate, no burst, a
# request waits up to 10 s for a token, then fails. vocab.hagstrom.nu is the project's own TemaTres test instance
# (UNESCO test copy). vocabularyserver.com, the TemaTres maintainer's server (Björn: 2
# until the maintainer was told, 5 from then; lower it if he asks). terminologias.filo.uba.ar (University of Buenos
# Aires) is held to 2 a second on top, by the SKOS profile's host policy in src/services.ts (UBA_HOST_POLICY); a
# request whose turn there is more than 30 s away fails at once. Any TemaTres on these hosts is reachable by its
# address; the known ids are in src/services.ts.
TEMATRES_ALLOWED_DOMAINS = "vocabularyserver.com,terminologias.filo.uba.ar,vocab.hagstrom.nu"
# The write test (src/services.ts, SKRIVPROV): only the test instance.
SKRIVPROV_ALLOWED_DOMAINS = "vocab.hagstrom.nu"
TEMATRES_RATE_LIMIT_RPS = "5"
TEMATRES_RATE_LIMIT_BURST = "1"
TEMATRES_RATE_LIMIT_MAX_WAIT_MS = "10000"
