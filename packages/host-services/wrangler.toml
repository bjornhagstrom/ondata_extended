# One Worker for several services, each at its own path (docs/DECISIONS.md, 2026-11-15):
#   /ecosystem/mcp            the CKAN ecosystem proof of concept, public (listed on / and /health)
#   /<secret>/mcp             the vocabulary service, private: the path is the secret SERVICES_VOCAB_PATH
#   /tematres/mcp             the TemaTres demo (vocabularies on vocabularyserver.com and a lunfardo lexicon on
#                             terminologias.filo.uba.ar), public since the issue to its
#                             maintainer (listed on / and /health)
# Set the secret (48 random characters; a Worker secret cannot be read back, so keep the value, e.g. in a password
# manager, before it goes to Cloudflare):
#   P=$(openssl rand -base64 36 | tr '+/' '-_' | tr -d '=\n'); echo "$P"
#   printf %s "$P" | npx wrangler secret put SERVICES_VOCAB_PATH -c packages/host-services/wrangler.toml
# The private URL is then https://<worker>/$P/mcp. To rotate: the same with a new value, then update the connectors.
# Deploy: npm run deploy:services (Björn's ok each time). Deployed 2026-11-15.
name = "ondata-extended-services"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = false

# No stored logs or traces: Cloudflare attaches the request URL, and so the private service's secret path, to what it
# stores for a request (docs/DECISIONS.md, 2026-11-15). Our log line per tool call can still be watched live with
# `wrangler tail`, which shows the URL too.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false

[vars]
# Each service has its own namespace and its own engine: allowed hosts, cache and rate limit are not shared.
VOCAB_ALLOWED_DOMAINS = "begrepp.hagstrom.nu"
ECOSYSTEM_ALLOWED_DOMAINS = "raw.githubusercontent.com"
# Two hosts; the rate limit below counts per hostname: at most 5 requests a second from one isolate, no burst, a
# request waits up to 10 s for a token, then fails. vocabularyserver.com, the TemaTres maintainer's server (Björn: 2
# until the maintainer was told, 5 from then; lower it if he asks). terminologias.filo.uba.ar (University of Buenos
# Aires) is held to 2 a second on top, by the SKOS profile's host policy in src/services.ts (UBA_HOST_POLICY); a
# request whose turn there is more than 30 s away fails at once. Any TemaTres on these hosts is reachable by its
# address; the known ids are in src/services.ts.
TEMATRES_ALLOWED_DOMAINS = "vocabularyserver.com,terminologias.filo.uba.ar"
TEMATRES_RATE_LIMIT_RPS = "5"
TEMATRES_RATE_LIMIT_BURST = "1"
TEMATRES_RATE_LIMIT_MAX_WAIT_MS = "10000"
